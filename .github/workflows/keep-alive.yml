name: Keep-alive ping

on:
  schedule:
    # Every 10 minutes, around the clock. A spun-down instance serves
    # Render's own bare "waking up" splash screen (zero actual site
    # content) for the ~20-60s it takes to cold-start -- confirmed
    # directly, and almost certainly what got the site flagged for
    # AdSense's "ads on screens without publisher content" policy, since
    # crawlers aren't limited to the daytime-IST window this used to
    # cover. Always-on uses ~744 of Render's 750 free instance-hours/month
    # for this one service -- leaves only a few hours of headroom for
    # redeploys or any other free-tier service on the same account, so
    # revisit this (e.g. a paid plan) if that margin ever becomes a
    # problem.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        run: curl -sf -o /dev/null -w "%{http_code}\n" https://aiod.online/ || true
