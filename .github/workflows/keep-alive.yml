name: Keep-alive ping

on:
  schedule:
    # Every 10 minutes, ~8am-midnight IST (02:30-18:30 UTC) -- keeps the
    # Render free-tier service from spinning down during hours real
    # visitors are likely to show up, without burning enough hours to
    # risk hitting Render's 750-hour/month free cap (this window is
    # ~450 hours/month, well under it). Outside this window the service
    # is left to spin down as normal.
    - cron: "*/10 2-18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        run: curl -sf -o /dev/null -w "%{http_code}\n" https://aiod.online/ || true
